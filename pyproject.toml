[project]
name = "querymesh"
version = "0.1.0"
description = "Production-grade multi-agent research assistant for arXiv"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "QueryMesh Contributors" }
]

# NOTE: Dependencies are introduced incrementally, phase by phase, per the
# project's development rules. Phase 0 only needs configuration, logging,
# and testing primitives. Later phases (LangGraph, FastMCP, OpenSearch,
# Jina, Redis, Langfuse, Logfire, Gradio, Airflow, etc.) will add their
# dependencies in the pyproject.toml section of the corresponding phase,
# with a short justification for each new dependency (see project rule:
# "Before introducing a dependency, explain why we need it").
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "opensearch-py[async]>=2.6",
    "langgraph>=1.2",
    "fastmcp>=3.4",
    "logfire>=4.0",
    "langfuse>=3.0",
    "redis>=5.0",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]
# Heavy ML dependency (torch, transformers, etc.) — imported lazily by
# DoclingParser so the rest of the app never requires it. Install with
# `pip install -e ".[docling]"` when you actually need real PDF parsing.
docling = [
    "docling",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["querymesh*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests requiring external services",
    "evaluation: retrieval/generation evaluation tests",
    "real_llm: tests that invoke a real LLM provider",
]

[tool.setuptools]
py-modules = []
